  <path d="M36 128 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 Z" fill="#ffd166" opacity="0.9"/>
  <circle cx="330" cy="130" r="2.2" fill="#ffe29a"/>
