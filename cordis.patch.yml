# The dsh-quant-indicators bundle patch: inserts the quant toolkit into any
# profile that stacks this bundle (or installs it via `dsh plugin add`).
#
# Row id and plugin name: a user can override config or disable the row from
# their own cordis.patch.yml by id.

- insert:
    - id: quant-indicators
      name: 'dsh-quant'
