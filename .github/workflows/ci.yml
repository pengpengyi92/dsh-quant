name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Type check gate
        run: npx tsc --noEmit
      - name: Typecheck market tests without DOM globals
        run: npm run typecheck:market-tests
      - name: Benchmark smoke
        run: npm run bench
      - name: Coverage gate
        run: |
          npm run test:cov 2>&1 | tee /tmp/cov.txt
          LINE_COV=$(grep "all files" /tmp/cov.txt | awk '{print $5}' | tr -d ' ')
          echo "line coverage: ${LINE_COV}%"
          python3 -c "import sys; cov=float('${LINE_COV}'.rstrip('%')); print('coverage OK' if cov >= 85 else f'COVERAGE FAIL: {cov}% < 85%'); sys.exit(0 if cov >= 85 else 1)"
      - name: Consumer test (packed package)
        run: bash scripts/consumer-test.sh

  ccxt-example:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install optional CCXT lock without lifecycle scripts
        run: npm ci --prefix demos/ccxt-public --ignore-scripts --no-fund
      - name: Audit optional data example
        run: npm audit --prefix demos/ccxt-public --omit=dev --audit-level=moderate
      - name: Typecheck example, bridge and synthetic tests
        run: node node_modules/typescript/bin/tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --allowImportingTsExtensions --allowJs --lib ES2022 --types node demos/ccxt-public/run.ts tests/ccxt.spec.ts tests/ccxt-transport.spec.ts tests/ccxt-evidence.spec.ts benchmark/ccxt-offline.ts
      - name: Fixed offline benchmark (no provider requests in CI)
        run: node --import tsx benchmark/ccxt-offline.ts
      - run: npm run build
      - name: Exclude optional dependencies and local raw data from npm pack
        run: node scripts/check-ccxt-pack.mjs

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.0-rc.6', '0.2.0-rc.2', '0.2.1-alpha.3', '0.2.1-rc.2', '0.2.1-rc.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install coherent pinned host family
        run: node scripts/install-dsh-cohort.mjs '${{ matrix.dsh }}'
      - run: npm run build
      - run: npm run typecheck
      - name: Typecheck compatibility scripts and Loader test
        run: npm run typecheck:scripts
      - name: Typecheck market tests without DOM globals
        run: npm run typecheck:market-tests
      - name: Unit and real-runtime regressions
        run: node --import tsx --test tests/*.spec.ts
      - name: 59 registrations and 56 deterministic calls
        run: npm run test:compat
      - name: Packed plugin in a real Loader consumer
        run: node scripts/consumer-runtime.mjs '${{ matrix.dsh }}'
